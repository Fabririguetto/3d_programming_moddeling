<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <clipPath id="c">
      <polygon points="24,2 43,13 43,35 24,46 5,35 5,13"/>
    </clipPath>
  </defs>
  <!-- 6 triangular panels meeting at center (24,24) -->
  <polygon points="24,2 5,13 24,24"  fill="#1C3461" clip-path="url(#c)"/>
  <polygon points="24,2 43,13 24,24" fill="#2D5FA8" clip-path="url(#c)"/>
  <polygon points="5,13 5,35 24,24"  fill="#172B52" clip-path="url(#c)"/>
  <polygon points="43,13 43,35 24,24" fill="#1E7A8C" clip-path="url(#c)"/>
  <polygon points="5,35 24,46 24,24" fill="#2A5A8A" clip-path="url(#c)"/>
  <polygon points="43,35 24,46 24,24" fill="#0F5060" clip-path="url(#c)"/>
  <!-- Inner isometric cube -->
  <polygon points="24,15 33,20 24,25 15,20" fill="#4A94C0"/>
  <polygon points="33,20 33,30 24,35 24,25" fill="#1A5276"/>
  <polygon points="15,20 15,30 24,35 24,25" fill="#1E7CA0"/>
  <!-- Hexagon wireframe border -->
  <polygon points="24,2 43,13 43,35 24,46 5,35 5,13" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.2"/>
  <!-- Subtle inner spokes -->
  <line x1="24" y1="2"  x2="24" y2="15" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
  <line x1="43" y1="13" x2="33" y2="20" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
  <line x1="5"  y1="13" x2="15" y2="20" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
  <line x1="5"  y1="35" x2="15" y2="30" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
  <line x1="43" y1="35" x2="33" y2="30" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
  <line x1="24" y1="46" x2="24" y2="35" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
</svg>
